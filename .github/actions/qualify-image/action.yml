name: Qualify pi-env container image
description: Build, verify, and scan one local pi-env image candidate.

inputs:
  image-tag:
    description: Local tag for the candidate image.
    required: false
    default: pi-env:ci

outputs:
  archive-path:
    description: Docker archive of the qualified candidate.
    value: ${{ steps.scan-image.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Export full verification evidence
      id: verification
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        reports="$RUNNER_TEMP/pi-env-reports/verification"
        mkdir -p "$reports"
        # Always rerun verification in this job, then reuse its local layers when
        # assembling the candidate. Failed tests can export evidence, not an image.
        docker buildx bake reports \
          --set "reports.output=type=local,dest=$reports"

    - name: Report full verification results
      id: verification-result
      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node scripts/ci-report.mjs verification "$RUNNER_TEMP/pi-env-reports/verification"

    - name: Build container image candidate
      id: build
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        if ! docker buildx bake candidate --set "candidate.tags=$IMAGE_TAG"; then
          echo "::error title=Container image build failed::Docker could not build the image candidate."
          exit 1
        fi

    - name: Verify container artifact contract
      id: artifact
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        if ! docker run --rm "$IMAGE_TAG" nub run verify:image-artifact; then
          echo "::error title=Container artifact verification failed::The image candidate does not satisfy the artifact contract."
          exit 1
        fi

    - name: Scan container image security policy
      id: scan-image
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        image_tar="$RUNNER_TEMP/pi-env-image.tar"
        results_dir="$RUNNER_TEMP/trivy-results"
        results="$results_dir/trivy-image-results.json"
        cache_dir="$RUNNER_TEMP/trivy-cache"
        ignore_file="$GITHUB_WORKSPACE/.trivyignore.yaml"
        evidence_dir="$RUNNER_TEMP/pi-env-reports"
        mkdir -p "$evidence_dir"
        echo "archive-path=$image_tar" >> "$GITHUB_OUTPUT"
        docker save "$IMAGE_TAG" --output "$image_tar"
        chmod 0644 "$image_tar"
        mkdir -p "$cache_dir" "$results_dir"
        if ! docker run --rm \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid,nodev \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e TRIVY_CACHE_DIR=/cache \
          -v "$image_tar:/image/pi-env-image.tar:ro" \
          -v "$cache_dir:/cache:rw" \
          -v "$results_dir:/results:rw" \
          -v "$ignore_file:/etc/trivy/.trivyignore.yaml:ro" \
          aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
          image \
          --input /image/pi-env-image.tar \
          --scanners vuln,secret,misconfig \
          --file-patterns pnpm:nub.lock \
          --severity HIGH,CRITICAL \
          --ignorefile /etc/trivy/.trivyignore.yaml \
          --format json \
          --output /results/trivy-image-results.json \
          --exit-code 0 \
          --skip-version-check; then
          echo "::error title=Container image scanner failed::The scanner could not evaluate the image candidate."
          exit 1
        fi
        node scripts/ci-report.mjs scan-report "$results" "$evidence_dir/trivy-image.json"
        set +e
        node scripts/trivy-image-summary.mjs "$results"
        summary_status="$?"
        set -e
        if [[ "$summary_status" -eq 1 ]]; then
          echo "::error title=Container image security policy failed::The image candidate has actionable security findings."
          exit 1
        fi
        if [[ "$summary_status" -ne 0 ]]; then
          echo "::error title=Container image scanner failed::The scanner returned an invalid image report."
          exit "$summary_status"
        fi

    - name: Summarize image qualification
      if: always()
      shell: bash
      env:
        VERIFICATION: ${{ steps.verification.outcome }}
        VERIFICATION_RESULT: ${{ steps.verification-result.outcome }}
        BUILD: ${{ steps.build.outcome }}
        ARTIFACT: ${{ steps.artifact.outcome }}
        SCAN: ${{ steps.scan-image.outcome }}
      run: |
        {
          echo '## Image qualification'
          echo
          echo '| Phase | Step outcome |'
          echo '| --- | --- |'
          printf '| Verification evidence export | %s |\n' "$VERIFICATION"
          printf '| Full verification policy gate | %s |\n' "$VERIFICATION_RESULT"
          printf '| Candidate assembly | %s |\n' "$BUILD"
          printf '| Artifact contract | %s |\n' "$ARTIFACT"
          printf '| Security scan and policy | %s |\n' "$SCAN"
          echo
          echo 'Evidence export success is not a test pass. The full-verification table owns test results. Skipped steps provide no qualification. Reports are retained as **image-evidence** for seven days when available.'
        } >> "$GITHUB_STEP_SUMMARY"
