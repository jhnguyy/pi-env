name: Qualify pi-env container image
description: Build, verify, and scan one local pi-env image candidate.

inputs:
  image-tag:
    description: Local tag for the candidate image.
    required: false
    default: pi-env:ci

outputs:
  archive-path:
    description: Docker archive of the qualified candidate.
    value: ${{ steps.scan-image.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Create memory-bounded qualification builder
      shell: bash
      run: |
        set -euo pipefail
        # Bound BuildKit and its build children together, without swap growth.
        docker buildx create --name pi-env-qualification --driver docker-container \
          --driver-opt image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe \
          --driver-opt memory=4g,memory-swap=4g --use --bootstrap
        [[ "$(docker info --format '{{.CgroupVersion}}')" == 2 ]]
        [[ "$(docker inspect buildx_buildkit_pi-env-qualification0 --format '{{.HostConfig.CgroupnsMode}}')" == private ]]
        docker exec buildx_buildkit_pi-env-qualification0 sh -ec \
          'test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296; test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0'

    - name: Verify build workers inherit the memory boundary
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        builder_pid=$(docker inspect buildx_buildkit_pi-env-qualification0 --format '{{.State.Pid}}')
        builder_group=$(awk -F: '$1 == "0" {print $3}' "/proc/$builder_pid/cgroup")
        # BuildKit moves its daemon into an init leaf; find the capped ancestor.
        while [[ -n "$builder_group" && "$builder_group" != / ]]; do
          if [[ "$(cat "/sys/fs/cgroup$builder_group/memory.max")" == 4294967296 && \
                "$(cat "/sys/fs/cgroup$builder_group/memory.swap.max")" == 0 ]]; then
            break
          fi
          builder_group=${builder_group%/*}
        done
        [[ -n "$builder_group" && "$builder_group" != / ]]
        base_image=$(awk '$1 == "FROM" {print $2; exit}' Dockerfile)
        docker buildx build --no-cache --output=type=cacheonly - <<DOCKERFILE &
        FROM $base_image
        RUN sleep 5
        DOCKERFILE
        probe_pid=$!
        trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
        for attempt in {1..120}; do
          worker_pid=$(docker top buildx_buildkit_pi-env-qualification0 -eo pid,comm | awk '$2 == "sleep" {print $1; exit}')
          if [[ -n "$worker_pid" ]]; then
            worker_group=$(awk -F: '$1 == "0" {print $3}' "/proc/$worker_pid/cgroup")
            echo "Builder cgroup: $builder_group"
            echo "Build worker cgroup: $worker_group"
            if [[ "$worker_group" != "$builder_group" && "$worker_group" != "$builder_group/"* ]]; then
              echo "::error::Build worker escaped the builder's memory boundary."
              exit 1
            fi
            wait "$probe_pid"
            exit 0
          fi
          kill -0 "$probe_pid" || break
          sleep 1
        done
        echo "::error::Could not establish build-worker memory containment."
        exit 1

    - name: Build container image candidate
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        if ! docker buildx bake image --load --set "image.tags=$IMAGE_TAG"; then
          echo "::error title=Container image build failed::Docker could not build the image candidate."
          exit 1
        fi

    - name: Run session-manager E2E
      id: session-manager-e2e
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PI_ENV_REVISION: ${{ github.sha }}
      run: |
        set -euo pipefail
        if ! docker buildx bake session-manager-e2e-evidence; then
          echo "::error title=Session-manager E2E build failed::Docker could not build the E2E target."
          exit 1
        fi
        cat .e2e-evidence/session-manager/result.json

    - name: Upload session-manager E2E evidence
      if: ${{ always() && steps.session-manager-e2e.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: session-manager-e2e-evidence
        path: ${{ github.workspace }}/.e2e-evidence/session-manager
        if-no-files-found: ignore

    - name: Gate on session-manager E2E
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PI_ENV_REVISION: ${{ github.sha }}
      run: |
        set -euo pipefail
        if ! docker buildx bake session-manager-e2e; then
          echo "::error title=Session-manager E2E failed::Real Pi in tmux did not meet the session-binding contract."
          exit 1
        fi

    - name: Verify container artifact contract
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        if ! docker run --rm "$IMAGE_TAG" nub run verify:image-artifact; then
          echo "::error title=Container artifact verification failed::The image candidate does not satisfy the artifact contract."
          exit 1
        fi

    - name: Scan container image security policy
      id: scan-image
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        image_tar="$RUNNER_TEMP/pi-env-image.tar"
        results_dir="$RUNNER_TEMP/trivy-results"
        results="$results_dir/trivy-image-results.json"
        cache_dir="$RUNNER_TEMP/trivy-cache"
        ignore_file="$GITHUB_WORKSPACE/.trivyignore.yaml"
        echo "archive-path=$image_tar" >> "$GITHUB_OUTPUT"
        docker save "$IMAGE_TAG" --output "$image_tar"
        chmod 0644 "$image_tar"
        mkdir -p "$cache_dir" "$results_dir"
        if ! docker run --rm \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid,nodev \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp \
          -e TRIVY_CACHE_DIR=/cache \
          -v "$image_tar:/image/pi-env-image.tar:ro" \
          -v "$cache_dir:/cache:rw" \
          -v "$results_dir:/results:rw" \
          -v "$ignore_file:/etc/trivy/.trivyignore.yaml:ro" \
          aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
          image \
          --input /image/pi-env-image.tar \
          --scanners vuln,secret,misconfig \
          --file-patterns pnpm:nub.lock \
          --severity HIGH,CRITICAL \
          --ignorefile /etc/trivy/.trivyignore.yaml \
          --format json \
          --output /results/trivy-image-results.json \
          --exit-code 0 \
          --skip-version-check; then
          echo "::error title=Container image scanner failed::The scanner could not evaluate the image candidate."
          exit 1
        fi
        set +e
        node scripts/trivy-image-summary.mjs "$results"
        summary_status="$?"
        set -e
        if [[ "$summary_status" -eq 1 ]]; then
          echo "::error title=Container image security policy failed::The image candidate has actionable security findings."
          exit 1
        fi
        if [[ "$summary_status" -ne 0 ]]; then
          echo "::error title=Container image scanner failed::The scanner returned an invalid image report."
          exit "$summary_status"
        fi

    - name: Report builder memory and remove qualification builder
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        if docker inspect buildx_buildkit_pi-env-qualification0 >/dev/null 2>&1; then
          docker inspect buildx_buildkit_pi-env-qualification0 \
            --format 'Builder OOM-killed={{.State.OOMKilled}} exit={{.State.ExitCode}}'
          if ! docker exec buildx_buildkit_pi-env-qualification0 sh -c \
            'for metric in memory.peak memory.events; do echo "$metric"; cat "/sys/fs/cgroup/$metric"; done'; then
            echo "Builder cgroup metrics unavailable; inspect the builder state above."
          fi
        fi
        if docker buildx inspect pi-env-qualification >/dev/null 2>&1; then
          docker buildx rm --force pi-env-qualification
        fi
