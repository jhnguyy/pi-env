name: Provisioning Base Image

on:
  pull_request:
    paths:
      - ci/provisioning/**
      - .github/workflows/ci-base.yml
  push:
    branches:
      - main
    paths:
      - ci/provisioning/**
      - .github/workflows/ci-base.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-base-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CANDIDATE_TAG: pi-env:ci-base

jobs:
  qualify:
    name: Qualify provisioning base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Build provisioning base
        run: docker build --tag "$CANDIDATE_TAG" ci/provisioning

      - name: Verify prerequisites and clean starting state
        run: |
          docker run --rm "$CANDIDATE_TAG" bash -ec '
            node --version
            git --version
            curl --version
            xz --version
            zstd --version
            command -v sudo
            test -s /usr/share/doc/nodejs/LICENSE
            test "$(id -u)" -ne 0
            for tool in nub nix npm npx yarn; do
              if command -v "$tool"; then
                printf "Unexpected preinstalled tool: %s\n" "$tool" >&2
                exit 1
              fi
            done
          '
          size="$(docker image inspect "$CANDIDATE_TAG" --format '{{.Size}}')"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Provisioning base candidate

          Image size: $size bytes (uncompressed layers).

          Runtime commands, non-root default, license notice, and clean Nub/Nix starting state verified.
          EOF

      - name: Archive candidate
        run: docker save "$CANDIDATE_TAG" --output "$RUNNER_TEMP/ci-base.tar"

      - name: Scan candidate
        run: |
          mkdir -p "$RUNNER_TEMP/ci-base-security" "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TRIVY_CACHE_DIR=/cache \
            -v "$RUNNER_TEMP/ci-base.tar:/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/cache:rw" \
            -v "$RUNNER_TEMP/ci-base-security:/reports:rw" \
            -v "$GITHUB_WORKSPACE/scripts/trivy-actionable.tpl:/report.tpl:ro" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --input /image.tar --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-version-check --quiet --format template --template @/report.tpl \
            --output /reports/policy.txt

      - name: Retain security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-base-security
          path: ${{ runner.temp }}/ci-base-security
          if-no-files-found: warn
          retention-days: 7

      - name: Retain qualified image for publisher
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-ci-base
          path: ${{ runner.temp }}/ci-base.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish qualified provisioning base
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download qualified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualified-ci-base
          path: ${{ runner.temp }}/qualified-ci-base

      - name: Load qualified image
        run: docker load --input "$RUNNER_TEMP/qualified-ci-base/ci-base.tar"

      - name: Authenticate publisher with GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish qualified image
        run: |
          commit_tag="$IMAGE_NAME:ci-base-$GITHUB_SHA"
          docker tag "$CANDIDATE_TAG" "$commit_tag"
          docker tag "$CANDIDATE_TAG" "$IMAGE_NAME:ci-base"
          docker push "$commit_tag"
          docker push "$IMAGE_NAME:ci-base"
          digest="$(docker buildx imagetools inspect "$commit_tag" --format '{{ printf "%s" .Manifest.Digest }}')"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Published provisioning base

          Digest-pinned image for consumers: \`$IMAGE_NAME:ci-base@$digest\`

          Commit tag: \`$commit_tag\`. The \`ci-base\` tag is mutable; consumers should pin the digest.
          EOF
