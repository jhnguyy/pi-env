name: Trivy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trivy-main
  cancel-in-progress: true

jobs:
  scan:
    name: Filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      options: --cap-drop=ALL --security-opt=no-new-privileges --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev
    env:
      TRIVY_CACHE_DIR: /tmp/trivy-cache
      TRIVY_SCAN_ROOT: /tmp/pi-env-checkout
    steps:
      - name: Checkout merge commit without checkout action
        shell: sh
        run: |
          set -eu
          mkdir -p "$TRIVY_SCAN_ROOT"
          cd "$TRIVY_SCAN_ROOT"
          git init --initial-branch=scan
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Run Trivy in job container
        shell: sh
        run: |
          set -eu
          mkdir -p "$TRIVY_CACHE_DIR"
          cd "$TRIVY_SCAN_ROOT"
          test -f package.json
          test -f lock.yaml

          trivy fs \
            --quiet \
            --scanners vuln \
            --file-patterns pnpm:lock.yaml \
            --include-dev-deps \
            --list-all-pkgs \
            --skip-dirs node_modules \
            --skip-dirs .git \
            --skip-version-check \
            --format json \
            --output /tmp/trivy-dependency-inventory.json \
            .

          if ! grep -q '"Target": *"lock.yaml"' /tmp/trivy-dependency-inventory.json; then
            echo "Trivy did not report lock.yaml as a dependency target. Verify the lock format and pnpm file pattern." >&2
            exit 2
          fi

          package_count="$(grep -c '"Identifier"' /tmp/trivy-dependency-inventory.json || true)"
          if [ "$package_count" -lt 10 ]; then
            echo "Trivy detected only $package_count dependency packages. Verify the lockfile scanner configuration." >&2
            exit 2
          fi
          echo "Trivy dependency inventory: lock.yaml ($package_count packages)."

          rm -f /tmp/trivy-policy-results.txt
          set +e
          trivy fs \
            --quiet \
            --scanners vuln,secret,misconfig \
            --file-patterns pnpm:lock.yaml \
            --skip-dirs node_modules \
            --skip-dirs .git \
            --severity HIGH,CRITICAL \
            --include-dev-deps \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            --skip-version-check \
            --format template \
            --template "@scripts/trivy-actionable.tpl" \
            --output /tmp/trivy-policy-results.txt \
            .
          trivy_status="$?"
          set -e

          sh scripts/trivy-filesystem-summary.sh /tmp/trivy-policy-results.txt "$trivy_status"
