name: Trivy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trivy-main
  cancel-in-progress: true

jobs:
  scan:
    name: Filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1
        with:
          persist-credentials: false

      - name: Scan source
        env:
          TRIVY_REPORT_DIR: ${{ runner.temp }}/trivy-filesystem-reports
        run: bash scripts/trivy-scan.sh

      - name: Retain filesystem scan reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-filesystem-reports
          path: ${{ runner.temp }}/trivy-filesystem-reports/
          if-no-files-found: warn
          retention-days: 7
