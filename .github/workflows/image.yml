name: Container Image
run-name: ${{ github.event_name == 'push' && 'Publish verified pi-env image to GHCR' || 'Verify pi-env image artifact' }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CANDIDATE_TAG: pi-env:ci

jobs:
  qualify:
    name: Build, verify, and scan image candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Build verification environment
        run: docker buildx bake test

      - name: Run full verification
        id: verify
        run: >-
          docker run --init --name pi-env-verification
          -e PI_ENV_REPORT_DIR=/tmp/pi-env-reports
          pi-env:test nub run verify:full

      - name: Collect verification reports
        if: always() && steps.verify.outcome != 'skipped'
        run: |
          trap 'docker rm -f pi-env-verification' EXIT
          mkdir -p "$RUNNER_TEMP/pi-env-reports"
          docker cp pi-env-verification:/tmp/pi-env-reports/. "$RUNNER_TEMP/pi-env-reports"
          cat "$RUNNER_TEMP/pi-env-reports/verification.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Build image candidate
        run: docker buildx bake image --set "image.tags=$CANDIDATE_TAG"

      - name: Verify image artifact
        run: docker run --rm "$CANDIDATE_TAG" nub run verify:image-artifact

      - name: Archive image candidate
        run: docker save "$CANDIDATE_TAG" --output "$RUNNER_TEMP/pi-env-image.tar"

      - name: Scan image candidate
        env:
          TRIVY_REPORT_DIR: ${{ runner.temp }}/pi-env-reports
        run: bash scripts/trivy-scan.sh image "$RUNNER_TEMP/pi-env-image.tar"

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence
          path: ${{ runner.temp }}/pi-env-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Retain qualified image for publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-image
          path: ${{ runner.temp }}/pi-env-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish qualified image
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download qualified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualified-image
          path: ${{ runner.temp }}/qualified-image

      - name: Load qualified image
        run: docker load --input "$RUNNER_TEMP/qualified-image/pi-env-image.tar"

      - name: Authenticate publisher with GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish verified image to GHCR
        run: |
          commit_tag="$IMAGE_NAME:$GITHUB_SHA"
          main_tag="$IMAGE_NAME:main"
          docker tag "$CANDIDATE_TAG" "$commit_tag"
          docker tag "$CANDIDATE_TAG" "$main_tag"
          docker push "$commit_tag"
          docker push "$main_tag"
          digest="$(docker buildx imagetools inspect "$commit_tag" --format '{{json .Manifest}}' | jq -er '.digest')"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Published image

          Digest-pinned pull: \`docker pull $IMAGE_NAME@$digest\`

          Tags: \`$commit_tag\`, \`$main_tag\` (tags can move).
          EOF
