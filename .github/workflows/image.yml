name: Container Image
run-name: ${{ github.event_name == 'push' && 'Publish verified pi-env image to GHCR' || 'Verify pi-env image artifact' }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CANDIDATE_TAG: pi-env:ci

jobs:
  verify:
    name: Build, verify, and scan image candidate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Qualify image candidate
        uses: ./.github/actions/qualify-image
        with:
          image-tag: ${{ env.CANDIDATE_TAG }}

  publish:
    name: Build, verify, scan, and publish image candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Qualify image candidate
        id: qualified-image
        uses: ./.github/actions/qualify-image
        with:
          image-tag: ${{ env.CANDIDATE_TAG }}

      - name: Authenticate publisher with GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish verified image to GHCR
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ steps.qualified-image.outputs.image-id }}
        run: |
          set -euo pipefail
          actual_image_id="$(docker image inspect --format '{{.Id}}' "$CANDIDATE_TAG")"
          if [[ "$actual_image_id" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error title=Container candidate identity changed::The image selected for publication is not the qualified image candidate."
            exit 1
          fi

          immutable_tag="$IMAGE_NAME:$GITHUB_SHA"
          main_tag="$IMAGE_NAME:main"
          docker tag "$CANDIDATE_TAG" "$immutable_tag"
          docker tag "$CANDIDATE_TAG" "$main_tag"

          if ! docker push "$immutable_tag"; then
            echo "::error title=Container image publication failed::GHCR rejected the immutable commit tag."
            exit 1
          fi
          if ! docker push "$main_tag"; then
            echo "::error title=Container image publication failed::GHCR rejected the main tag."
            exit 1
          fi
