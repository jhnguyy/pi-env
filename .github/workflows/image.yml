name: Container Image
run-name: ${{ github.event_name == 'push' && 'Publish verified pi-env image to GHCR' || 'Verify pi-env image artifact' }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CANDIDATE_TAG: pi-env:ci

jobs:
  qualify:
    name: Build, verify, and scan image candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.qualified-image.outputs.image-id }}
      archive-sha256: ${{ steps.qualified-image.outputs.archive-sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Qualify image candidate
        id: qualified-image
        uses: ./.github/actions/qualify-image
        with:
          image-tag: ${{ env.CANDIDATE_TAG }}

      - name: Retain qualified image for publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-image
          path: ${{ steps.qualified-image.outputs.archive-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish qualified image
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download qualified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualified-image
          path: ${{ runner.temp }}/qualified-image

      - name: Verify and load qualified image
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.qualify.outputs.archive-sha256 }}
          EXPECTED_IMAGE_ID: ${{ needs.qualify.outputs.image-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ || ! "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid candidate identity::Qualification did not provide valid image and archive identities."
            exit 1
          fi
          cd "$RUNNER_TEMP/qualified-image"
          printf '%s  pi-env-image.tar\n' "$EXPECTED_ARCHIVE_SHA256" | sha256sum --check --strict
          docker load --input pi-env-image.tar
          actual_image_id="$(docker image inspect --format '{{.Id}}' "$CANDIDATE_TAG")"
          if [[ "$actual_image_id" != "$EXPECTED_IMAGE_ID" ]]; then
            echo "::error title=Container candidate identity changed::The loaded image is not the qualified image candidate."
            exit 1
          fi
          echo "Loaded qualified image ID: $actual_image_id"
          echo "Verified archive SHA-256: $EXPECTED_ARCHIVE_SHA256"

      - name: Authenticate publisher with GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish verified image to GHCR
        shell: bash
        env:
          EXPECTED_IMAGE_ID: ${{ needs.qualify.outputs.image-id }}
        run: |
          set -euo pipefail
          immutable_tag="$IMAGE_NAME:$GITHUB_SHA"
          main_tag="$IMAGE_NAME:main"
          docker tag "$EXPECTED_IMAGE_ID" "$immutable_tag"
          docker tag "$EXPECTED_IMAGE_ID" "$main_tag"

          if ! docker push "$immutable_tag"; then
            echo "::error title=Container image publication failed::GHCR rejected the immutable commit tag."
            exit 1
          fi
          if ! docker push "$main_tag"; then
            echo "::error title=Container image publication failed::GHCR rejected the main tag."
            exit 1
          fi
