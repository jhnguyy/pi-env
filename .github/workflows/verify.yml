name: Nub Setup

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nub-setup:
    name: Nub setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Read declared Nub version
        id: toolchain
        shell: bash
        run: |
          echo "version=$(node -p 'require("./package.json").packageManager.split("@")[1]')" >> "$GITHUB_OUTPUT"

      - name: Setup Nub and project Node
        uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a
        with:
          nub-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: nub.lock

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          nub --version
          node --version
          nub node which

      - name: Install dependencies
        shell: bash
        run: nub install --frozen-lockfile

      # The image build runs the full portfolio against its baked toolchain, including
      # tmux 3.8. This job covers what only a stock runner shows: Nub provisioning,
      # portable setup, and installation with the host's own tools.
      - name: Verify portable setup
        shell: bash
        run: nub run verify:phase setup-tests

      - name: Verify build and install readiness
        shell: bash
        run: nub run verify:phase build && nub run verify:phase install-readiness

      - name: Verify safe Analyze canary
        shell: bash
        run: nub run --node analyze -- --checks async-risk src/analyze/policy.ts

  nix-flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Check flake
        shell: bash
        run: nix flake check --print-build-logs
