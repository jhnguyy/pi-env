name: Portable Setup and Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nub-setup:
    name: Portable setup and install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Read declared Nub version
        id: toolchain
        run: |
          printf 'version=%s\n' "$(node -p 'require("./package.json").packageManager.split("@")[1]')" >> "$GITHUB_OUTPUT"

      - name: Setup Nub and project Node
        uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a
        with:
          nub-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: nub.lock

      - name: Show toolchain
        run: |
          nub --version
          node --version
          nub node which

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Verify changed-file policy
        run: nub run verify --checks-only

      # Exercise provisioning on a stock runner, not only our container toolchain.
      - name: Verify portable setup
        run: nub run test:setup

      - name: Verify build and install readiness
        run: nub run build && nub run verify:install

      - name: Verify safe Analyze canary
        run: nub run --node analyze -- --checks async-risk src/analyze/policy.ts

  nix-flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Check flake
        run: nix flake check --print-build-logs
