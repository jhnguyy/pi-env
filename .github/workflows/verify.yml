name: Nub Setup

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nub-setup:
    name: Nub setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Read declared Nub version
        id: toolchain
        shell: bash
        run: |
          echo "version=$(node -p 'require("./package.json").packageManager.split("@")[1]')" >> "$GITHUB_OUTPUT"

      - name: Setup Nub and project Node
        uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a
        with:
          nub-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: nub.lock

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          nub --version
          node --version
          nub node which

      - name: Install dependencies
        shell: bash
        run: nub install --frozen-lockfile

      - name: Verify canonical portfolio
        shell: bash
        run: nub run verify

      - name: Verify safe Analyze canary
        shell: bash
        run: nub run --node analyze -- --checks async-risk src/analyze/policy.ts

  nix-flake-check:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Check flake
        shell: bash
        run: nix flake check --print-build-logs
