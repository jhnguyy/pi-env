name: Nix Builder

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-builder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  qualify:
    name: Verify with Nix builder
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org

      - name: Configure cache directory
        run: echo "BUILDER_CACHE=$RUNNER_TEMP/nix-builder-cache" >> "$GITHUB_ENV"

      - name: Resolve builder closure identity
        id: closure
        run: |
          root="$(nix eval --raw .#builder-root.outPath)"
          echo "identity=${root##*/}" >> "$GITHUB_OUTPUT"

      - name: Restore builder closure
        id: cache
        uses: actions/cache/restore@v4.3.0
        with:
          path: ${{ env.BUILDER_CACHE }}
          key: nix-builder-v1-${{ runner.arch }}-${{ steps.closure.outputs.identity }}
          restore-keys: |
            nix-builder-v1-${{ runner.arch }}-

      - name: Build builder closure and layered image
        id: build
        run: |
          if [[ -d "$BUILDER_CACHE/nar" ]]; then
            export NIX_CONFIG="${NIX_CONFIG:-}"$'\n'"extra-substituters = file://$BUILDER_CACHE?trusted=1"
          fi
          root="$(nix build .#builder-root --no-link --print-out-paths --print-build-logs)"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          stream="$(nix build .#builder-image --no-link --print-out-paths --print-build-logs)"
          "$stream" | docker load
          nix path-info --closure-size "$root" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect pi-env-builder:ci --format 'Image size: {{.Size}} bytes' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare verification container
        id: container
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          docker create --init --name pi-env-verification \
            -e GITHUB_BASE_REF -e PI_ENV_REPORT_DIR=/tmp/pi-env-reports \
            pi-env-builder:ci sleep infinity
          # Keep Git metadata container-owned when fixtures change HOME, without
          # changing ownership of the host checkout.
          docker cp "$GITHUB_WORKSPACE/." pi-env-verification:/workspace
          docker start pi-env-verification
          docker exec pi-env-verification chown -R 0:0 /workspace

      - name: Install frozen dependencies
        run: docker exec pi-env-verification nub install --frozen-lockfile

      - name: Verify changed-file policy
        run: docker exec pi-env-verification nub run verify --checks-only

      - name: Run full verification
        id: verify
        run: docker exec pi-env-verification nub run verify:full

      - name: Verify safe Analyze canary
        run: docker exec pi-env-verification nub run --node analyze -- --checks async-risk src/analyze/policy.ts

      - name: Check flake
        run: docker exec pi-env-verification nix flake check --print-build-logs

      - name: Collect verification reports
        if: always() && steps.verify.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/pi-env-reports"
          docker cp pi-env-verification:/tmp/pi-env-reports/. "$RUNNER_TEMP/pi-env-reports"
          cat "$RUNNER_TEMP/pi-env-reports/verification.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/pi-env-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Remove verification container
        if: always() && steps.container.outcome != 'skipped'
        run: docker rm -f pi-env-verification

      # Only trusted main builds populate the shared cache. Cache runtime outputs,
      # not the whole store, image tarballs, or transient compiler dependencies.
      - name: Prepare bounded binary cache
        id: export
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        env:
          BUILDER_ROOT: ${{ steps.build.outputs.root }}
        run: |
          bytes="$(nix path-info --json --closure-size "$BUILDER_ROOT" | jq '[.[] | .closureSize] | add')"
          if (( bytes > 1073741824 )); then
            echo 'Builder closure exceeds the 1 GiB cache-entry budget; skipping cache export.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -rf "$BUILDER_CACHE"
          nix copy --to "file://$BUILDER_CACHE" "$BUILDER_ROOT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          du -sh "$BUILDER_CACHE" >> "$GITHUB_STEP_SUMMARY"

      - name: Save builder closure
        if: steps.export.outputs.ready == 'true'
        uses: actions/cache/save@v4.3.0
        with:
          path: ${{ env.BUILDER_CACHE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
