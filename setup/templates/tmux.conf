# pi-env tmux configuration — requires tmux 3.8+.
# Setup sources this from ~/.tmux.conf unless terminal configuration is externally managed.
# Reload the template directly: tmux source-file /path/to/pi-env/setup/templates/tmux.conf

# ── Terminal integration ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-features "*:hyperlinks"
set -g allow-passthrough on
# OSC 52 lets applications in all panes overwrite the client clipboard if the terminal permits.
set -s set-clipboard on

# ── Keyboard and copy mode ──────────────────────────────────────────────────
set -s escape-time 10
# Preserve modified keys such as Shift+Enter for Pi.
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mode-keys vi
set -g status-keys vi

# ── Windows and history ─────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# ── Gruvbox palette ─────────────────────────────────────────────────────────
# Slots name roles, not hues: black bar, dark-grey raised surfaces, light-grey and white
# text, yellow current tab (orange in light, where Gruvbox yellow lacks contrast).
set -g dark-theme-black "#3c3836"
set -g dark-theme-dark-grey "#504945"
set -g dark-theme-light-grey "#a89984"
set -g dark-theme-white "#ebdbb2"
set -g dark-theme-yellow "#fabd2f"
set -g dark-theme-blue "#83a598"
set -g light-theme-black "#ebdbb2"
set -g light-theme-dark-grey "#d5c4a1"
set -g light-theme-light-grey "#7c6f64"
set -g light-theme-white "#3c3836"
set -g light-theme-yellow "#af3a03"
set -g light-theme-blue "#076678"

# ── Borders, messages, and status bar ────────────────────────────────────────
set -g pane-border-style "fg=themedarkgrey"
set -g pane-active-border-style "fg=themeblue"
set -g status-style "bg=themeblack,fg=themelightgrey"
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[bg=themedarkgrey,fg=themewhite,bold] #S #[bg=themeblack] "
set -g status-right "#[fg=#928374]%H:%M #[fg=themedarkgrey]│ #[fg=themelightgrey]%b %d "
set -g message-style "bg=themedarkgrey,fg=themewhite"
set -g message-command-style "bg=themedarkgrey,fg=themewhite"
set -g mode-style "bg=themedarkgrey,fg=themewhite"
set -g window-status-style "fg=themelightgrey"
set -g window-status-current-style "bg=themedarkgrey,fg=themeyellow,bold"
set -g window-status-separator ""

# ── Agent window tabs ───────────────────────────────────────────────────────
# Restore effective tab styles after indicators: their push-default changes #[default].
set -g @pi_agent_tab_style '#{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}'
set -g @pi_agent_current_tab_style '#{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}'
set -g window-status-format " #{?@pi_agent_status,#{E:@pi_agent_status}#[default]#[#{E:@pi_agent_tab_style}] ,}#I:#W "
set -g window-status-current-format " #{?@pi_agent_status,#{E:@pi_agent_status}#[default]#[#{E:@pi_agent_current_tab_style}] ,}#I:#W "

# ── Agent overflow markers ──────────────────────────────────────────────────
# Overflow arrows take the colour of the highest-priority agent on their side, read from
# space-separated @pi_agent_rank values ("<priority><colour>").
set -g @pi_agent_left '#{W:#{?#{e|<:#{window_index},#{active_window_index}}, #{@pi_agent_rank},}} '
set -g @pi_agent_right '#{W:#{?#{e|>:#{window_index},#{active_window_index}}, #{@pi_agent_rank},}} '
set -g @pi_agent_left_style '#{?#{m/r: 3,#{E:@pi_agent_left}},fg=#{s/.* 3([^ ]*) .*/\1/;E:@pi_agent_left},#{?#{m/r: 2,#{E:@pi_agent_left}},fg=#{s/.* 2([^ ]*) .*/\1/;E:@pi_agent_left},#{?#{m/r: 1,#{E:@pi_agent_left}},fg=#{s/.* 1([^ ]*) .*/\1/;E:@pi_agent_left},#{?#{m/r: 0,#{E:@pi_agent_left}},fg=#{s/.* 0([^ ]*) .*/\1/;E:@pi_agent_left},default}}}}'
set -g @pi_agent_right_style '#{?#{m/r: 3,#{E:@pi_agent_right}},fg=#{s/.* 3([^ ]*) .*/\1/;E:@pi_agent_right},#{?#{m/r: 2,#{E:@pi_agent_right}},fg=#{s/.* 2([^ ]*) .*/\1/;E:@pi_agent_right},#{?#{m/r: 1,#{E:@pi_agent_right}},fg=#{s/.* 1([^ ]*) .*/\1/;E:@pi_agent_right},#{?#{m/r: 0,#{E:@pi_agent_right}},fg=#{s/.* 0([^ ]*) .*/\1/;E:@pi_agent_right},default}}}}'
# tmux 3.8's default status-format[0], copied because tmux has no marker style option,
# with styled markers and the tab styles defined above.
set -g status-format[0] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]#[#{E:@pi_agent_left_style}]<#[list=right-marker]#[#{E:@pi_agent_right_style}]>#[list=on]#{W:#[range=window|#{window_index} #{E:@pi_agent_tab_style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{E:@pi_agent_current_tab_style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
