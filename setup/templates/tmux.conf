# ─── pi-env tmux config ──────────────────────────────────────────────────────
# Sourced from ~/.tmux.conf by setup.sh. Reload with: tmux source ~/.tmux.conf
#
# QoL + Gruvbox light/dark theme. Kept minimal and portable — no prefix changes,
# no host-specific bindings.

# ── QoL ─────────────────────────────────────────────────────────────────────
set -g base-index 1               # start window numbering at 1
setw -g pane-base-index 1         # start pane numbering at 1
set -g renumber-windows on        # re-index windows when one is closed
set -s escape-time 10             # near-instant Esc (default 500ms is painful)
set -g history-limit 50000
set -g mode-keys vi               # vi keys in copy-mode (j/k, v, y)
set -g status-keys vi             # vi keys in command prompt

# ── Extended keys ────────────────────────────────────────────────────────────
set -g extended-keys on           # preserve modified Enter/Tab/etc. through tmux
set -g extended-keys-format csi-u # pi's preferred modified-key encoding

# ── True color ───────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# ── OSC 8 hyperlinks + DCS passthrough ──────────────────────────────────────
set -ga terminal-features "*:hyperlinks"
set -g allow-passthrough on

# ── Gruvbox ──────────────────────────────────────────────────────────────────
# tmux picks the light or dark set from the client's reported background, so the
# bar matches Ghostty and Pi. Slots carry roles rather than hues: black is the bar,
# dark-grey raised surfaces, light-grey secondary text, white primary text, and
# yellow the current tab (orange in light, where Gruvbox yellow lacks contrast).
set -g dark-theme-black "#3c3836"
set -g dark-theme-dark-grey "#504945"
set -g dark-theme-light-grey "#a89984"
set -g dark-theme-white "#ebdbb2"
set -g dark-theme-yellow "#fabd2f"
set -g dark-theme-blue "#83a598"
set -g light-theme-black "#ebdbb2"
set -g light-theme-dark-grey "#d5c4a1"
set -g light-theme-light-grey "#7c6f64"
set -g light-theme-white "#3c3836"
set -g light-theme-yellow "#af3a03"
set -g light-theme-blue "#076678"

set -g pane-border-style "fg=themedarkgrey"
set -g pane-active-border-style "fg=themeblue"
set -g status-style "bg=themeblack,fg=themelightgrey"
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[bg=themedarkgrey,fg=themewhite,bold] #S #[bg=themeblack] "
set -g status-right "#[fg=#928374]%H:%M #[fg=themedarkgrey]│ #[fg=themelightgrey]%b %d "
# The agent indicator sets the tab's foreground and weight; backgrounds stay here.
# E expands the trusted indicator's dynamic style without changing window names.
set -g window-status-style "fg=themelightgrey"
set -g window-status-current-style "bg=themedarkgrey,fg=themeyellow,bold"
set -g window-status-format " #{?@pi_agent_status,#{E:@pi_agent_status} ,}#I:#W "
set -g window-status-current-format " #{?@pi_agent_status,#{E:@pi_agent_status} ,}#I:#W "
set -g window-status-separator ""
set -g message-style "bg=themedarkgrey,fg=themewhite"
set -g message-command-style "bg=themedarkgrey,fg=themewhite"
set -g mode-style "bg=themedarkgrey,fg=themewhite"
