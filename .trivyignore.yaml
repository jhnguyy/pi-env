  # Retain native CLI checking while fixed compiler packages are unavailable.
  # Exceptions cover only the pinned Linux x64 executables, not other Go tools.
  - id: CVE-2026-56851
    paths:
      - "**/@effect+tsgo-linux-x64@0.56.0/node_modules/@effect/tsgo-linux-x64/lib/tsc"
      - "**/@typescript+typescript-linux-x64@7.0.2/node_modules/@typescript/typescript-linux-x64/lib/tsc"
    expired_at: 2026-11-25
    statement: "Accept the crafted-input panic risk temporarily for local CLI checking. The affected nickname profile appears unused. Remove when compiler packages bundle fixed x/text."
  - id: CVE-2026-56852
    paths:
      - "**/@effect+tsgo-linux-x64@0.56.0/node_modules/@effect/tsgo-linux-x64/lib/tsc"
      - "**/@typescript+typescript-linux-x64@7.0.2/node_modules/@typescript/typescript-linux-x64/lib/tsc"
    expired_at: 2026-11-25
    statement: "Accept the malformed-UTF-8 normalization hang risk temporarily for local CLI checking. Do not expose this compiler as an untrusted-input service. Remove when compiler packages bundle fixed x/text."

  # The stock compiler supplies version discovery. typecheck executes the Effect
